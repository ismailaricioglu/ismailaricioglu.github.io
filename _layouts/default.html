<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">

    <!-- 🔴 RESPONSIVE İÇİN KRİTİK -->
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <title>{{ page.title }} | {{ site.title }}</title>

    <link rel="stylesheet" href="{{ "/assets/css/style.css" | relative_url }}">
  </head>

  <body>
    <div class="wrapper">

      <header>
        <h1>{{ site.title }}</h1>
        <p>{{ site.description }}</p>

        {% if site.logo %}
          <img src="{{ site.logo | relative_url }}" alt="Logo">
        {% endif %}
      </header>

      <!-- ✅ RESMİN HEMEN ALTINDA -->
      <nav class="site-nav">
        <a href="{{ '/' | relative_url }}">Ana Sayfa</a>
        ·
        <a href="{{ '/projects.html' | relative_url }}">Projeler</a>
        ·
        <a href="{{ '/contact.html' | relative_url }}">İletişim</a>
      </nav>

      <!-- 🔴 RESPONSIVE GENİŞLİK BURADAN GELİR -->
      <section>
        {{ content }}
      </section>

      <footer>
        <p>&copy; {{ site.time | date: "%Y" }}</p>
      </footer>

    </div>
  </body>
</html>
